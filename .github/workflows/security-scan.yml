name: security-scan
on: [push, pull_request]
permissions: { contents: read }
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secrets (gitleaks, full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --redact --no-banner
      - name: Insecure code (semgrep)
        run: pipx run semgrep scan --config p/security-audit --config p/secrets --error --metrics=off .
      - name: Vulnerable libraries (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with: { scan-type: fs, severity: 'HIGH,CRITICAL', exit-code: '1', ignore-unfixed: true }
